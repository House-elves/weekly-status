# A House Elves elf: what Elf Desk needs to install, set up, schedule and run weekly-status.
name: weekly-status
title: Weekly status
version: 1.0.2
author: "@phillip-kruger"
description: Drafts your weekly status from your GitHub work, for you to edit and send from the desk's Status tab.
main: WeeklyStatus.java
config: ~/.config/weekly-status/config
tools: [gh, claude]

reads:
  - Your GitHub activity (PRs, reviews, issues), through gh.
writes:
  - An email with your status to you, only when you click Send to me and confirm.
  - Nothing to your team: Write it to the team opens a Gmail draft in your work account, which you send yourself.

settings:
  - key: DISPLAY_NAME
    label: Your name
    help: In the subject line.
    kind: text
  - key: GITHUB_USER
    label: GitHub account
    help: Whose work goes in the status.
    kind: login
    default: ${github-user}
  - key: EXCLUDE_ORGS
    label: Leave out these orgs
    help: Comma-separated GitHub orgs whose work isn't part of the status.
    kind: words
    default: ""
  - key: LOOKBACK_DAYS
    label: Days covered
    help: How far back each status looks.
    kind: int
    min: 1
    max: 31
    default: "7"
  - key: TEAM_TO
    label: The team
    help: Who the status goes to (comma-separated). Write it to the team opens a Gmail draft to them.
    kind: emails
    optional: true
  - key: TEAM_FROM
    label: Your work account
    help: The Gmail account the team's draft opens in, like you@redhat.com. Empty for the account Gmail opens by default.
    kind: email
    optional: true
  - key: SEND_TO
    label: Send to me
    help: Where Send to me goes (comma-separated). Empty for no Send to me.
    kind: emails
    optional: true
  - key: GMAIL_ADDRESS
    label: Send to me from
    help: The Gmail account Send to me sends with.
    kind: email
    optional: true
  - key: GMAIL_APP_PASSWORD
    label: Gmail app password
    help: For Send to me, from myaccount.google.com/apppasswords.
    kind: secret
    goes-with: [GMAIL_ADDRESS]
    optional: true

commands:
  draft:
    label: Draft this week's status
    args: [--save]
  dry-run:
    label: Draft it now (sends nothing)
    args: [--save]

dry-run: dry-run

# Its tab (and dashboard card), drawn by ui/status.js in the desk's sandboxed frame. It reads only the drafts it saved,
# and asks the desk for these actions; the desk asks you before Send to me.
tab:
  page: ui/status.js
  card: true
refresh:
  command: draft
  schedule: "Mon *-*-* 08:00"
data: [runs]

actions:
  send:
    label: Send it to me
    confirm: "Email the weekly status to yourself?"
    args: [--action=send]
    params:
      draft: {pattern: "\\d{4}-\\d{2}-\\d{2}_\\d{2}-\\d{2}-\\d{2}"}
      body: {max: 100000}
      target: {one-of: [me]}
  sent-yourself:
    label: Mark it sent to the team yourself
    args: [--action=sent-yourself]
    ask: false
    params:
      draft: {pattern: "\\d{4}-\\d{2}-\\d{2}_\\d{2}-\\d{2}-\\d{2}"}
      sent: {kind: bool}
